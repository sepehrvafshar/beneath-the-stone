  :root {
    --cave-deep: #1a0f0a;
    --cave-wall: #2b1a10;
    --amber: #c17f3a;
    --amber-bright: #e0a45c;
    --parchment: #e8d5b0;
    --stone: #8b7355;
    --text: #f0e4cf;
    --dim: #a08a68;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ---------- Per-era ambience ----------
     Deep past: cold, mineral darkness. torch is the only warmth
     Lantern age: warm whale-oil glow, sepia richness
     Present: neutral fluorescent flatness, slightly clinical */
  body {
    --bg-core: #241409;
    --glow: rgba(224,164,92,0.25);
    --era-accent: var(--amber);
    transition: background-color 1.2s ease;
  }
  body[data-era="L1"] {
    --bg-core: #101418;
    --glow: rgba(140,170,200,0.18);
    --era-accent: #7fa0b8;
    background-color: #0b0e12;
  }
  body[data-era="L1"] .era-marker { letter-spacing: 0.45em; border-color: rgba(127,160,184,0.3); color: var(--era-accent); }
  body[data-era="L1"] .passage p { color: #dde4ea; }
  body[data-era="L1"] .artifact { border-left-color: #7fa0b8; color: #c8d4de; }

  body[data-era="L2"] {
    --bg-core: #33200c;
    --glow: rgba(232,180,100,0.35);
    --era-accent: #e0a45c;
    background-color: #1f1206;
  }
  body[data-era="L2"] .era-marker { font-variant: small-caps; letter-spacing: 0.28em; font-size: 0.85rem; }
  body[data-era="L2"] .passage p { color: #f5e6c8; }
  body[data-era="L2"] button { border-color: #9c7a4a; }

  body[data-era="L3"] {
    --bg-core: #171a17;
    --glow: rgba(190,200,190,0.15);
    --era-accent: #a8b5a8;
    background-color: #121412;
  }
  body[data-era="L3"] .era-marker { font-family: 'Courier New', monospace; letter-spacing: 0.2em; border-color: rgba(168,181,168,0.3); color: var(--era-accent); }
  body[data-era="L3"] .passage p { color: #e6eae4; }
  body[data-era="L3"] .artifact { border-left-color: #a8b5a8; color: #ccd4cc; font-family: 'Courier New', monospace; font-size: 0.88rem; }

  body {
    background: var(--cave-deep);
    background-image:
      radial-gradient(ellipse at 50% 30%, var(--bg-core) 0%, transparent 70%),
      repeating-linear-gradient(175deg, transparent 0px, transparent 120px, rgba(139,115,85,0.025) 121px, transparent 122px);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    line-height: 1.75;
  }

  /* symbolic era emblem */
  .era-art {
    display: flex;
    justify-content: center;
    margin: 0 0 1.2rem;
  }
  .era-art svg {
    width: 84px;
    height: 84px;
    opacity: 0.9;
    filter: drop-shadow(0 0 14px var(--glow));
  }
  .era-art .flame { animation: breathe 3.5s ease-in-out infinite; transform-origin: 50% 80%; }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); opacity: 0.95; }
    50% { transform: scaleY(1.06); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
html:not([data-motion="full"]) .era-art .flame { animation: auto ease 0s 1 normal none running none; }
}

  /* layer progress markers — each era carries its own color */
  .progress {
    display: flex;
    justify-content: center;
    gap: 1.4rem;
    margin-bottom: 1.6rem;
    flex-wrap: wrap;
  }
  .progress span {
    min-width: 72px;
    text-align: center;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--dim);
    border-top: 2px solid rgba(139,115,85,0.35);
    padding-top: 0.35rem;
  }
  .progress span.p1.done { color: #9fc0d8; border-top-color: #7fa0b8; }
  .progress span.p2.done { color: var(--amber-bright); border-top-color: var(--amber); }
  .progress span.p3.done { color: #c0cec0; border-top-color: #a8b5a8; }

  #game {
    max-width: 640px;
    width: 100%;
    padding: 3rem 1.5rem 5rem;
  }

  /* typographic monogram — the game's wordmark */
  .lamp {
    text-align: center;
    font-size: 1.05rem;
    color: var(--amber-bright);
    animation: flicker 4.5s infinite;
    margin-bottom: 0.6rem;
    letter-spacing: 0.6em;
    font-family: Georgia, serif;
    font-weight: bold;
    text-transform: uppercase;
  }
  .lamp .sep {
    color: var(--stone);
    font-weight: normal;
    padding: 0 0.15em;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; text-shadow: 0 0 18px rgba(224,164,92,0.7); }
    45% { opacity: 0.82; text-shadow: 0 0 10px rgba(224,164,92,0.4); }
    52% { opacity: 0.95; text-shadow: 0 0 22px rgba(224,164,92,0.8); }
    60% { opacity: 0.85; text-shadow: 0 0 12px rgba(224,164,92,0.5); }
  }
  @media (prefers-reduced-motion: reduce) {
html:not([data-motion="full"]) .lamp { animation: auto ease 0s 1 normal none running none; }
html:not([data-motion="full"]) .passage { animation: auto ease 0s 1 normal none running none !important; opacity: 1 !important; }
}

  h1 {
    font-size: 1.7rem;
    text-align: center;
    font-weight: normal;
    letter-spacing: 0.18em;
    color: var(--parchment);
    margin-bottom: 0.3rem;
    text-transform: uppercase;
  }

  /* Full title on the opening screen; compact corner identity elsewhere */
  body:not([data-screen="title"]) #game > h1 {
    position: absolute;
    top: 1.15rem;
    left: 1.5rem;
    z-index: 3;
    margin: 0;
    max-width: calc(100% - 6rem);
    text-align: left;
    font-size: 1rem;
    line-height: 1.05;
    letter-spacing: 0.08em;
    color: var(--parchment);
    text-transform: none;
    opacity: 0.92;
  }

  body:not([data-screen="title"]) #content {
    padding-top: 2.35rem;
  }

  @media (max-width: 520px) {
    body:not([data-screen="title"]) #game > h1{ left: 1.1rem; }
    body:not([data-screen="title"]) #game > h1 { font-size: 0.92rem; }

  }

  .era-marker {
    text-align: center;
    color: var(--amber);
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    border-top: 1px solid rgba(193,127,58,0.35);
    border-bottom: 1px solid rgba(193,127,58,0.35);
    padding: 0.6rem 0;
    margin: 0 0 2rem;
  }

  .passage {
    animation: fadeIn 0.9s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* 1 — staggered reveal: light reaching further into the dark */
  .passage p, .passage .artifact {
    opacity: 0;
    animation: fadeIn 0.7s ease forwards;
  }
  .passage p:nth-of-type(1) { animation-delay: 0.05s; }
  .passage p:nth-of-type(2) { animation-delay: 0.25s; }
  .passage p:nth-of-type(3) { animation-delay: 0.45s; }
  .passage p:nth-of-type(4) { animation-delay: 0.65s; }
  .passage .artifact { animation-delay: 0.7s; }
  .passage .choices { opacity: 0; animation: fadeIn 0.7s ease forwards; animation-delay: 0.9s; }

  /* 2 — title screen presence */
  body[data-screen="title"] h1 {
    font-size: 2.3rem;
    letter-spacing: 0.3em;
    animation: emerge 2.2s ease;
  }
  body[data-screen="title"] .lamp {
    font-size: 1.3rem;
    animation: flicker 4.5s infinite, emerge 2.2s ease;
  }
  @keyframes emerge {
    0% { opacity: 0; letter-spacing: 0.55em; filter: blur(3px); }
    100% { opacity: 1; filter: blur(0); }
  }

  /* 3 — torchlight catching the option you consider */
  button { position: relative; }
  button::before {
    content: "›";
    position: absolute;
    left: 0.4rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--era-accent, var(--amber-bright));
    opacity: 0;
    transition: opacity 0.2s ease, left 0.2s ease;
    font-family: Georgia, serif;
  }
  button:hover::before, button:focus-visible::before {
    opacity: 1;
    left: 0.55rem;
  }

  /* 5 — reflection consequences surface one by one */

<style>
/* v25 — game typography, discovery cue, and guaranteed disclaimer visibility */
:root{
  --font-display:'Cinzel', Georgia, serif;
  --font-narrative:'Spectral', Georgia, serif;
  --font-ui:'Inter', system-ui, sans-serif;
  --font-accent:'Marcellus', Georgia, serif;
}
body{font-family:var(--font-narrative);}
button,.btn,.timeline,.progress,.ui,.badge,nav{font-family:var(--font-ui);}
h1,h2,h3,.title,.hero-title,.title-main{font-family:var(--font-display);}
.title-eyebrow,.title-topbar,.title-menu button,.title-discovery-hint{font-family:var(--font-ui);}
.title-tagline{font-family:var(--font-accent);font-size:clamp(1rem,2vw,1.16rem);line-height:1.55;letter-spacing:.025em;}
.title-main{font-weight:600;letter-spacing:.075em;}
.title-main span{font-family:var(--font-accent);font-weight:400;font-style:normal;letter-spacing:.035em;}
.title-menu button{font-weight:600;letter-spacing:.16em;}
.title-eyebrow{font-weight:600;letter-spacing:.29em;}

.title-discovery-hint{
  position:absolute;
  left:50%;
  bottom:5.15rem;
  z-index:20;
  transform:translateX(-50%);
  width:max-content;
  max-width:calc(100% - 2rem);
  padding:.52rem .85rem;
  border:1px solid rgba(226,183,119,.24);
  border-radius:999px;
  color:rgba(244,228,201,.82);
  background:rgba(0,0,0,.48);
  box-shadow:0 8px 28px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(8px);
  text-align:center;
  font-size:.69rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  pointer-events:none;
  animation:discoveryHint 2.5s ease-in-out infinite;
}
.title-discovery-hint::before{
  content:'✦';
  margin-right:.55rem;
  color:#e1aa62;
  text-shadow:0 0 14px rgba(225,170,98,.8);
}
.title-discovery-hint.used{opacity:0;transform:translate(-50%,8px);transition:opacity .6s ease,transform .6s ease;}
@keyframes discoveryHint{0%,100%{opacity:.56}50%{opacity:1}}

@media(max-width:620px){
  .title-discovery-hint{bottom:5.7rem;font-size:.6rem;letter-spacing:.08em;white-space:normal;width:calc(100% - 2rem);}

}
@media(prefers-reduced-motion:reduce){
html:not([data-motion="full"]) .title-discovery-hint { animation: auto ease 0s 1 normal none running none; }
}
</style>

<style>

<script>
// A disclosure keeps accessibility preferences available without crowding the header.
const accessibilityControls = document.getElementById('accessibilityControls');
const accessibilityToggle = document.getElementById('accessibilityToggle');
const accessibilityPanel = document.getElementById('accessibilityPanel');
function closeAccessibilityPanel(restoreFocus = false) {
  accessibilityPanel.hidden = true;
  accessibilityToggle.setAttribute('aria-expanded', 'false');
  if (restoreFocus) accessibilityToggle.focus();
}
accessibilityToggle.addEventListener('click', () => {
  const open = accessibilityPanel.hidden;
  accessibilityPanel.hidden = !open;
  accessibilityToggle.setAttribute('aria-expanded', String(open));
});
document.addEventListener('pointerdown', event => {
  if (!accessibilityControls.contains(event.target)) closeAccessibilityPanel();
}, true);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !accessibilityPanel.hidden) {
    event.preventDefault();
    event.stopImmediatePropagation();
    closeAccessibilityPanel(true);
  }
}, true);
accessibilityControls.addEventListener('focusout', event => {
  if (!accessibilityControls.contains(event.relatedTarget)) closeAccessibilityPanel();
});

// Accessibility preferences stay in this tab's session and tolerate blocked storage.
function readAccessibilityPreference(key, fallback) {
  try { return sessionStorage.getItem('bts-' + key) || fallback; }
  catch { return fallback; }
}
function saveAccessibilityPreference(key, value) {
  try { sessionStorage.setItem('bts-' + key, value); } catch {}
}
function setTextSize(step, persist = true) {
  const value = ['1', '2', '3'].includes(String(step)) ? String(step) : '1';
  document.documentElement.dataset.text = value;
  const label = ['default', 'large', 'larger'][Number(value) - 1];
  const button = document.getElementById('textSizeControl');
  button.textContent = 'Aa ' + value;
  button.setAttribute('aria-label', 'Text size: ' + label);
  button.title = 'Text size: ' + label;
  if (persist) saveAccessibilityPreference('text', value);
}
setTextSize(readAccessibilityPreference('text', '1'), false);
document.getElementById('textSizeControl').addEventListener('click', () => {
  setTextSize(Number(document.documentElement.dataset.text) % 3 + 1);
});

function setReadingMode(plain, persist = true) {
  const mode = plain ? 'plain' : 'standard';
  document.documentElement.dataset.reading = mode;
  const button = document.getElementById('readingModeControl');
  button.setAttribute('aria-pressed', String(plain));
  button.title = 'Reading mode: ' + mode;
  if (persist) saveAccessibilityPreference('reading', mode);
}
setReadingMode(readAccessibilityPreference('reading', 'standard') === 'plain', false);
document.getElementById('readingModeControl').addEventListener('click', () => {
  setReadingMode(document.documentElement.dataset.reading !== 'plain');
});

const systemMotionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
function prefersReducedMotion() {
  return document.documentElement.dataset.motion === 'reduced';
}
function setMotionPreference(reduced, persist = true) {
  const mode = reduced ? 'reduced' : 'full';
  document.documentElement.dataset.motion = mode;
  document.getElementById('motionControl').setAttribute('aria-pressed', String(reduced));
  if (persist) { motionUsesSystem = false; saveAccessibilityPreference('motion', mode); }
  if (reduced) {
    const intro = document.querySelector('.title-intro');
    if (intro) {
      clearTimeout(Number(intro.dataset.timer));
      intro.closest('.title-hero')?.classList.remove('menu-hidden');
      intro.remove();
    }
  }
}
const savedMotionPreference = readAccessibilityPreference('motion', 'system');
let motionUsesSystem = savedMotionPreference === 'system';
setMotionPreference(savedMotionPreference === 'system' ? systemMotionPreference.matches : savedMotionPreference === 'reduced', false);
document.getElementById('motionControl').addEventListener('click', () => setMotionPreference(!prefersReducedMotion()));
systemMotionPreference.addEventListener('change', (event) => {
  if (motionUsesSystem) setMotionPreference(event.matches, false);
});

// ---------- Game State ----------
const state = {
  choices: [],          // records { id, dimension, era, text, consequence, preserved }
  visited: [],
  notes: []           // collectible historical context terms
};
let currentNodeId = 'title';
const navigationHistory = [];
let isNavigatingBack = false;
let isTransitioning = false;
let journalHasUnseenUpdate = false;
let journalHasBeenOpened = false;
let audioDesiredOn = false;
let sessionClockOrigin = performance.now();
let sessionClockOffset = 0;

// ---------- Local playtest telemetry (exported only on demand) ----------
function createPlaytestSessionId() {
  return `WR-${new Date().toISOString().replace(/\D/g, '').slice(0, 14)}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
}

const playtest = {
  sessionId: createPlaytestSessionId(),
  startedAt: new Date(),
  nodeEnteredAt: performance.now(),
  visits: [],
  events: [],
  backCount: 0,
  journalOpenCount: 0
};

function sessionElapsedSeconds() {
  return sessionClockOffset + (performance.now() - sessionClockOrigin) / 1000;
}

function logPlaytestEvent(type, details = {}) {
  playtest.events.push({
    seconds: Number(sessionElapsedSeconds().toFixed(1)),
    type,
    ...details
  });
}

function recordPageVisit(nodeId) {
  playtest.nodeEnteredAt = performance.now();
  playtest.visits.push({ nodeId, at: new Date().toISOString() });
  logPlaytestEvent('screen_view', { nodeId });
}

function secondsOnCurrentNode() {
  return Number(((performance.now() - playtest.nodeEnteredAt) / 1000).toFixed(1));
}


// ---------- Story Data ----------
// Each node: era, text[], artifact?, choices[{label, next, record?}]
const story = {

  // ---------- TITLE PAGE ----------
  title: {
    titleScreen: true
  },

  // ---------- INTRO ----------
  start: {
    era: "The Threshold — Present Day",
    text: [
      "Cold air rises from the entrance of Mammoth Cave. It has moved through these passages long before anyone began recording its history.",
      "You enter with the tools of research: a notebook, a camera, and a permit. Ahead lies the world's longest known cave system, where traces of many generations remain preserved in the darkness.",
      "Three moments in the cave's history are waiting for you. Each offers a different question. You will experience them all, but you may choose where to begin."
    ],
    choices: [
      { label: "Descend into the deep past — five thousand years ago", next: "L1_enter" },
      { label: "Enter the age of lanterns — the nineteenth century", next: "L2_enter" },
      { label: "Stay in the present — the preservation debate", next: "L3_enter" }
    ]
  },

  // =====================================================
  // LAYER 1 — PRE-CONTACT (5,000 years ago)
  // =====================================================
  L1_enter: {
    era: "First Light — c. 3000 BCE",
    text: [
      "The cave changes around you. When your eyes adjust, the cave is lit by burning <span class='exam' data-note='Prehistoric explorers used river-cane torches to light their way through Mammoth Cave. Torch fragments and other artifacts remain preserved in the cave’s dry passages; Indigenous exploration of the cave dates to roughly 5,000–4,000 years ago.'>cane torches</span> — river cane, bundled tight, carried by people who have walked these passages for generations.",
      "You cannot change what happened here. All you can do is watch.",
      "A group moves through the passage ahead: gatherers, miners, carrying woven bags. They work the walls for <span class='exam' data-note='Prehistoric miners scraped gypsum, mirabilite, epsomite, and related minerals from cave walls. Their exact uses are not known; archaeologists have proposed medicine, agriculture, trade, and ritual activity. Evidence of the mining remains visible in the cave.'>gypsum and mirabilite</span> — minerals whose meaning you can guess at but do not know. Their <span class='exam' data-note='Woven plant-fiber footwear and other organic objects survived because of the cave’s dry, stable passages. These objects belong to the prehistoric period of Indigenous exploration and show highly practiced fiber craftsmanship.'>sandals</span>, woven from plant fiber, leave prints in the sediment that will still be here in five thousand years."
    ],
    choices: [
      { label: "Follow the miners deeper", next: "L1_miners" },
      { label: "Stay and study what they leave behind", next: "L1_remains" }
    ]

// One explicitly saved session stays on this browser and device.
const SAVED_SESSION_KEY = 'bts-saved-session-v1';
const savedNoteCatalog = new Map();
Object.values(story).forEach(node => {
  const template = document.createElement('template');
  template.innerHTML = (node.text || []).join('\n');
  template.content.querySelectorAll('.exam').forEach(el => {

const isStoryNode = id => typeof id === 'string' && Object.hasOwn(story, id);
const isPlayableNode = id => isStoryNode(id) && !['title', 'about', 'credits'].includes(id);
const validSeconds = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
function validateSavedSnapshot(saved) {
  if (!saved || !isStoryNode(saved.nodeId) || !Array.isArray(saved.choices) || saved.choices.length > 8 ||
      !Array.isArray(saved.visited) || saved.visited.length > 10000 || !saved.visited.every(isStoryNode) ||
      !Array.isArray(saved.notes) || saved.notes.length > savedNoteCatalog.size) throw new Error('Invalid progress');
  const choices = saved.choices.map(choice => {
    if (!choice || !isStoryNode(choice.sourceNode) || !validSeconds(choice.decisionSeconds)) throw new Error('Invalid decision');
    const original = (story[choice.sourceNode].choices || []).find(c => c.record && c.record.id === choice.id && c.record.preserved === choice.preserved);
    if (!original) throw new Error('Unknown decision');
    return { ...original.record, sourceNode:choice.sourceNode, decisionSeconds:choice.decisionSeconds };
  });
  const notes = saved.notes.map(note => {
    if (!note || !savedNoteCatalog.has(note.term)) throw new Error('Unknown note');
    return { term:note.term, note:savedNoteCatalog.get(note.term) };
  });
  if (new Set(choices.map(c => c.id)).size !== choices.length || new Set(notes.map(n => n.term)).size !== notes.length) throw new Error('Duplicate entry');
  return { nodeId:saved.nodeId, choices, visited:[...saved.visited], notes };
}
function readSavedSession() {
  try {
    const raw = localStorage.getItem(SAVED_SESSION_KEY);
    if (!raw) return { data:null, message:'No saved session in this browser yet.' };
    if (raw.length > 4000000) throw new Error('Save too large');
    const saved = JSON.parse(raw);
    if (!saved || saved.version !== 1 || !isPlayableNode(saved.progress?.nodeId) ||
        !validSeconds(saved.elapsedSeconds) || !validSeconds(saved.nodeSeconds) ||
        typeof saved.savedAt !== 'string' || !Number.isFinite(Date.parse(saved.savedAt)) ||
        !Array.isArray(saved.history) || saved.history.length > 1000 ||
        typeof saved.journalOpened !== 'boolean' || typeof saved.journalUnseen !== 'boolean') throw new Error('Invalid save');
    const progress = validateSavedSnapshot(saved.progress);
    const history = saved.history.map(validateSavedSnapshot);
    const log = saved.playtest;
    if (!log || typeof log.sessionId !== 'string' || log.sessionId.length > 100 ||
        typeof log.startedAt !== 'string' || !Number.isFinite(Date.parse(log.startedAt)) ||
        !Number.isInteger(log.backCount) || log.backCount < 0 || !Number.isInteger(log.journalOpenCount) || log.journalOpenCount < 0 ||
        !Array.isArray(log.visits) || log.visits.length > 20000 ||
        !log.visits.every(v => v && (isStoryNode(v.nodeId) || v.nodeId === 'journey') && typeof v.at === 'string' && Number.isFinite(Date.parse(v.at))) ||
        !Array.isArray(log.events) || log.events.length > 20000 || !log.events.every(event => event &&
          typeof event.type === 'string' && validSeconds(event.seconds) && Object.values(event).every(value =>
            (typeof value === 'string' && value.length <= 2000) || typeof value === 'boolean' || (typeof value === 'number' && Number.isFinite(value))))) throw new Error('Invalid session log');
    return { data:{ ...saved, progress, history }, message:'Saved in this browser: ' + new Date(saved.savedAt).toLocaleString('en-US') + '.' };
  } catch {
    return { data:null, message:'No readable save is available. Browser storage may be unavailable, or the saved session may be incompatible.' };
  }
}
function saveCurrentSession() {
  const saved = {
    version:1, savedAt:new Date().toISOString(), progress:snapshotState(),
    history:navigationHistory, journalOpened:journalHasBeenOpened, journalUnseen:journalHasUnseenUpdate,
    elapsedSeconds:sessionElapsedSeconds(), nodeSeconds:secondsOnCurrentNode(),
    playtest:{ sessionId:playtest.sessionId, startedAt:playtest.startedAt.toISOString(), visits:playtest.visits,
      events:playtest.events, backCount:playtest.backCount, journalOpenCount:playtest.journalOpenCount }
  };
  try {
    const raw = JSON.stringify(saved);
    localStorage.setItem(SAVED_SESSION_KEY, raw);
    return localStorage.getItem(SAVED_SESSION_KEY) === raw;
  } catch { return false; }
}
function loadSavedSession() {
  const result = readSavedSession();

  if (!beginTransition()) return;
  document.getElementById('journeyDialog')?.close();
  const saved = result.data;
  state.choices = saved.progress.choices;
  state.visited = saved.progress.visited;
  state.notes = saved.progress.notes;
  navigationHistory.splice(0, navigationHistory.length, ...saved.history);
  journalHasBeenOpened = saved.journalOpened;
  journalHasUnseenUpdate = saved.journalUnseen;
  playtest.sessionId = saved.playtest.sessionId;
  playtest.startedAt = new Date(saved.playtest.startedAt);
  playtest.visits = saved.playtest.visits;
  playtest.events = saved.playtest.events;
  playtest.backCount = saved.playtest.backCount;
  playtest.journalOpenCount = saved.playtest.journalOpenCount;
  sessionClockOffset = saved.elapsedSeconds;
  sessionClockOrigin = performance.now();
  render(saved.progress.nodeId);
  playtest.nodeEnteredAt = performance.now() - saved.nodeSeconds * 1000;
  logPlaytestEvent('session_loaded', { nodeId:saved.progress.nodeId });

  endTransition();
}

  const title = document.querySelector('#game > h1');

    done();

  // Phase 1: let the opening identity dissolve in place.
  title.style.transition = 'opacity 360ms ease, transform 360ms ease';
  title.style.opacity = '0';
  title.style.transform = 'translateY(-4px)';

  // Phase 2: render the next passage, then let the compact corner identity appear.
  setTimeout(() => {
    title.style.transition = '';
    title.style.transform = '';
    done();
    requestAnimationFrame(() => {
      title.classList.remove('brand-arrival');
      void title.offsetWidth;
      title.classList.add('brand-arrival');
      title.style.opacity = '';
    });
  }, 390);

    if (heading.isConnected && !journalPanel.classList.contains('open')) {
      heading.focus({ preventScroll: false });
    }
  });
}

function render(nodeId) {
  ensurePersistentSoundControl();
  currentNodeId = nodeId;
  document.body.setAttribute('data-node', nodeId);
  recordPageVisit(nodeId);
  const node = story[nodeId];
  if(state.visited[state.visited.length-1] !== nodeId) state.visited.push(nodeId);
  content.innerHTML = '';

  // ambient era theming
  if (nodeId.startsWith('L1')) document.body.setAttribute('data-era', 'L1');
  else if (nodeId.startsWith('L2')) document.body.setAttribute('data-era', 'L2');
  else if (nodeId.startsWith('L3')) document.body.setAttribute('data-era', 'L3');
  else document.body.removeAttribute('data-era');

  // special screen presence
  if (nodeId === 'title' || nodeId === 'about' || nodeId === 'credits') {
    document.body.setAttribute('data-screen', nodeId);
  } else if (nodeId === 'reflection') {
    document.body.setAttribute('data-screen', 'reflection');
  } else {
    document.body.setAttribute('data-screen', 'gameplay');
  }
  const backBtn = document.getElementById('backBtn');
  backBtn.hidden = nodeId === 'title' || navigationHistory.length === 0;

  const wrap = document.createElement('div');
  wrap.className = document.body.getAttribute('data-screen') === 'gameplay' ? 'passage gameplay-passage' : 'passage';

  const art = artFor(nodeId);
  if (art) {
    const artDiv = document.createElement('div');
    artDiv.className = 'era-art';
    artDiv.innerHTML = art;
    wrap.appendChild(artDiv);
  }

  if (nodeId !== 'title' && nodeId !== 'about' && nodeId !== 'credits') {
    wrap.appendChild(progressBar());
  }

  if (node.era) {
    const era = document.createElement('div');
    era.className = 'era-marker';
    era.textContent = node.era;
    wrap.appendChild(era);
  }

  if (node.titleScreen) {
    renderTitle(wrap);
    content.appendChild(wrap);
    window.scrollTo({ top: 0 });
    if (prefersReducedMotion()) focusPassageHeading(wrap, '#heroTitle');
    return;
  }

  if (node.aboutScreen) {
    renderAbout(wrap);
    content.appendChild(wrap);
    window.scrollTo({ top: 0 });
    focusPassageHeading(wrap, '#aboutTitle');
    return;
  }

  if (node.creditsScreen) {
    renderCredits(wrap);
    content.appendChild(wrap);
    window.scrollTo({ top: 0 });
    focusPassageHeading(wrap, '#creditsTitle');
    return;
  }

  if (node.reflection) {
    content.appendChild(wrap);
    runEndingSequence(wrap);
    window.scrollTo({ top: 0 });
    return;
  }

  let stagger = 0;
  node.text.forEach(t => {
    const p = document.createElement('p');
    p.innerHTML = t;
    p.style.animationDelay = (0.1 + stagger * 0.18) + 's';
    stagger++;
    wrap.appendChild(p);
  });

  if (eraCodas[nodeId]) {
    const coda = document.createElement('p');
    coda.className = 'era-coda';
    coda.textContent = eraCodas[nodeId];
    coda.style.animationDelay = (0.1 + stagger * 0.18) + 's';
    stagger++;
    wrap.appendChild(coda);
  }

  if (node.artifact) {
    const a = document.createElement('div');
    a.className = 'artifact';
    a.innerHTML = node.artifact;
    a.style.animationDelay = (0.1 + stagger * 0.18) + 's';
    wrap.appendChild(a);
  }

  const choicesDiv = document.createElement('div');
  choicesDiv.className = 'choices';

  let choices = node.choices;

  if (node.dynamic) {
    // hub: offer unvisited layers, or reflection if all done
    choices = [];
    if (!state.visited.includes('L1_enter')) choices.push({ label: "Descend into the deep past — five thousand years ago", next: "L1_enter" });
    if (!state.visited.includes('L2_enter')) choices.push({ label: "Enter the age of lanterns — the nineteenth century", next: "L2_enter" });
    if (!state.visited.includes('L3_enter')) choices.push({ label: "Stay in the present — the preservation debate", next: "L3_enter" });
    if (choices.length === 0) {
      choices.push({ label: "There is nowhere left to go but inward. Read the record you made.", next: "reflection", cls: "continue" });
    }
  } else if (choices && choices.length > 1) {
    const label = document.createElement('div');
    label.className = 'choice-label';
    label.textContent = "What do you do?";
    choicesDiv.appendChild(label);
  }

  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'game-choice' + (c.cls === 'continue' ? ' continue-btn is-continue' : '');
    const labelSpan = document.createElement('span');
    labelSpan.className = 'choice-text';
    labelSpan.innerHTML = c.label;
    btn.appendChild(labelSpan);
    btn.addEventListener('click', () => {
      if (c.record) {
        if (!beginTransition()) return;
        navigationHistory.push(snapshotState());
        const decisionSeconds = secondsOnCurrentNode();
        state.choices.push({ ...c.record, decisionSeconds, sourceNode: currentNodeId });
        logPlaytestEvent('decision', {
          nodeId: currentNodeId,
          choiceId: c.record.id,
          era: c.record.era,
          dimension: c.record.dimension,
          preserved: c.record.preserved,
          decisionSeconds
        });
        markJournalUpdated('save');
        showChoiceMemory(c.record, () => {
          showQuietMoment(c.record, () => {
            const ov = document.getElementById('fadeOverlay');
            const reducedMotion = prefersReducedMotion();
            if (ov && !reducedMotion) {
              ov.classList.add('dimming');
              setTimeout(() => {
                render(c.next);
                ov.classList.remove('dimming');
                endTransition();
              }, 450);
            } else {
              render(c.next);
              endTransition();
            }
          });
        });
        return;
      }
      logPlaytestEvent('navigation_choice', { from: currentNodeId, to: c.next, secondsOnNode: secondsOnCurrentNode() });
      navigateTo(c.next, { animateBrand: currentNodeId === 'title' });
    });
    choicesDiv.appendChild(btn);
  });

  const hasDiscovery = !node.dynamic && node.discovery && choices && choices.length > 1 && choices.some(c => c.record);
  if (hasDiscovery) {
    choicesDiv.hidden = true;
    const gate = document.createElement('div');
    gate.className = 'discovery-gate';
    const prompt = document.createElement('p');
    prompt.textContent = node.discovery.prompt;
    gate.appendChild(prompt);
    const reveal = document.createElement('button');
    reveal.type = 'button';
    reveal.className = 'continue-btn';
    reveal.textContent = node.discovery.action;
    reveal.addEventListener('click', () => {
      gate.remove();
      choicesDiv.hidden = false;
      choicesDiv.classList.add('revealed');
      choicesDiv.querySelector('button')?.focus();
    });
    gate.appendChild(reveal);
    wrap.appendChild(gate);
  }
  wrap.appendChild(choicesDiv);
  content.appendChild(wrap);
  wireExaminables(wrap);
  window.scrollTo({ top: 0 });
  focusPassageHeading(wrap);
}

// ---------- Examine interactions ----------
function wireExaminables(scope) {
  scope.querySelectorAll('.exam').forEach(el => {
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-expanded', 'false');
    el.setAttribute('title', 'Open historical context');

    const open = () => {
      const passage = el.closest('.passage');
      if (!passage) return;

      const existing = passage.querySelector('.exam-note');
      const sameTerm = existing && existing.dataset.term === el.textContent.trim();
      passage.querySelectorAll('.exam').forEach(term => term.setAttribute('aria-expanded', 'false'));

      if (existing) existing.remove();
      if (sameTerm) return;

      const note = document.createElement('div');
      note.className = 'exam-note';
      note.dataset.term = el.textContent.trim();
      note.setAttribute('role', 'note');
      note.innerHTML = `<strong>Historical context</strong><div>${el.dataset.note || 'No additional context is available.'}</div><button type="button" class="exam-note-close" aria-label="Close historical context for ${el.textContent.trim()}">Close context</button>`;

      const paragraph = el.closest('p');
      if (paragraph) paragraph.insertAdjacentElement('afterend', note);
      else el.insertAdjacentElement('afterend', note);

      el.setAttribute('aria-expanded', 'true');
      const closeContext = note.querySelector('.exam-note-close');
      closeContext?.addEventListener('click', () => {
        note.remove();
        el.setAttribute('aria-expanded', 'false');
        el.focus();
      });
      const term = el.textContent.trim();
      if (!state.notes.some(n => n.term === term)) {
        state.notes.push({ term, note: el.dataset.note || '' });
        logPlaytestEvent('historical_context_opened', { nodeId: currentNodeId, term });
        markJournalUpdated('note');
        showNoteDiscovery(term);
        refreshJournal();
      }
      note.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'nearest' });
    };

    el.addEventListener('click', open);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        open();
      }
    });
  });
}

// ---------- Back navigation ----------
document.getElementById('backBtn').addEventListener('click', () => {
  if (!beginTransition()) return;
  playtest.backCount += 1;
  logPlaytestEvent('back_used', { from: currentNodeId, secondsOnNode: secondsOnCurrentNode() });
  const previous = navigationHistory.pop();
  if (!previous) {
    endTransition();
    return;
  }
  state.choices = previous.choices.map(c => ({ ...c }));
  state.visited = [...previous.visited];
  state.notes = (previous.notes || []).map(n => ({ ...n }));
  currentNodeId = previous.nodeId;
  render(previous.nodeId);
  refreshJournal();
  endTransition();
});

// Count distinct terms once from the complete story, using the notebook's term identity.
const TOTAL_HISTORICAL_NOTES = (() => {
  const terms = new Set();
  const template = document.createElement('template');
  Object.values(story).forEach(node => {
    template.innerHTML = (node.text || []).join('\n');
    template.content.querySelectorAll('.exam').forEach(el => terms.add(el.textContent.trim()));
  });
  return terms.size;
})();

function refreshJournal() {
  journalEntries.innerHTML = '';

  const historySection = document.createElement('section');

  historySection.innerHTML = `<h3><span class="section-icon" aria-hidden="true">🗺️</span>Historical Notes</h3><div class="journal-count">${state.notes.length} of ${TOTAL_HISTORICAL_NOTES} encountered</div>`;

    const e = document.createElement('div');

  decisionsSection.innerHTML = '<h3><span class="section-icon" aria-hidden="true">✍️</span>Personal Decisions</h3>';

    state.choices.forEach(c => {

      const dimensionIcons = { documentation: '🖋️', authority: '🗝️', access: '🚪', repair: '🧱', stewardship: '🕯️', reflection: '💭' };
      const eraIcons = { 'Deep Past': '🔥', 'Lantern Age': '🏮', 'Present': '🧭' };
      const dimensionIcon = dimensionIcons[c.dimension] || dimensionIcons.reflection;
      const eraIcon = eraIcons[c.era] || '•';
      const statusIcon = c.preserved ? '📖' : '🌑';
      const statusLabel = c.preserved ? 'Entered the record' : 'Held in restraint';
      d.innerHTML = `<div class="decision-meta"><strong><span aria-hidden="true">${eraIcon}</span> ${c.era}</strong><span class="dimension-tag"><span class="tag-icon" aria-hidden="true">${dimensionIcon}</span>${dimension.label}</span><span class="entry-status" role="img" aria-label="${statusLabel}">${statusIcon}</span></div><span>${c.text}</span><small>${choiceReflection(c)}</small>`;
      decisionsSection.appendChild(d);
    });
  }
  journalEntries.appendChild(decisionsSection);
}

function openJournal(event) {
  if (event) {

  event.preventDefault();

document.addEventListener('keydown', (e) => {
  if (!journalPanel.classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeJournal();
    return;
  }
  if (e.key === 'Tab') {
    const focusable = getJournalFocusable();
    if (!focusable.length) {
      e.preventDefault();
      journalPanel.focus();
      return;
    }
    e.preventDefault();
    const current = focusable.indexOf(document.activeElement);
    const next = current < 0
      ? (e.shiftKey ? focusable.length - 1 : 0)
      : (current + (e.shiftKey ? -1 : 1) + focusable.length) % focusable.length;
    focusable[next].focus();
  }
});


function armInitialAudioExperience(){
  const sound=ensurePersistentSoundControl();
  if(!sound.dataset.invited){
    sound.dataset.invited='true';
    sound.classList.add('sound-invite');
    setTimeout(()=>sound.classList.remove('sound-invite'),4800);
  }

  let activated=false;
  const cleanup=()=>{
    document.removeEventListener('pointerdown',activate,true);
    document.removeEventListener('keydown',activate,true);
    document.removeEventListener('touchstart',activate,true);
    document.removeEventListener('pointermove',activate,true);
  };
  const activate=(event)=>{
    if(activated) return;
    // A direct press on the volume control must remain a toggle, not first start
    // ambience on pointerdown and then immediately turn it off on click.
    if(event?.target?.closest?.('.global-sound-control')) return;
    activated=true;
    sound.classList.remove('sound-invite');
    if(audioDesiredOn && !caveAudio) startCaveAudio(sound);
    cleanup();
  };
  document.addEventListener('pointerdown',activate,true);
  document.addEventListener('keydown',activate,true);
  document.addEventListener('touchstart',activate,{capture:true,passive:true});
  document.addEventListener('pointermove',activate,{capture:true,passive:true});
}

let caveAudio=null;
let persistentSoundButton=null;
function createNoiseBuffer(ctx, seconds=6, color='brown'){
  const buffer=ctx.createBuffer(2, Math.floor(ctx.sampleRate*seconds), ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const data=buffer.getChannelData(ch); let brown=0, pink=0;
    for(let i=0;i<data.length;i++){
      const white=Math.random()*2-1;
      brown=(brown*.992)+(white*.008);
      pink=(pink*.94)+(white*.06);
      data[i]=color==='air' ? (pink*.42+white*.035) : brown*3.1;
    }
  }
  return buffer;
}
function ensurePersistentSoundControl(){
  if(persistentSoundButton && document.contains(persistentSoundButton)) return persistentSoundButton;
  const sound=document.createElement('button');
  sound.id='globalSoundControl';
  sound.className='title-sound global-sound-control'; sound.type='button';
  sound.setAttribute('aria-label',(caveAudio||audioDesiredOn)?'Turn sound off':'Turn sound on');
  sound.setAttribute('aria-pressed',(caveAudio||audioDesiredOn)?'true':'false');
  sound.title=(caveAudio||audioDesiredOn)?'Sound on: click to mute':'Sound off: click to enable';
  sound.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="sound-wave" d="M16 9.2c1.4 1.5 1.4 4.1 0 5.6"/><path class="sound-wave" d="M18.7 6.7c2.8 2.9 2.8 7.7 0 10.6"/><path class="sound-off-line" d="M16.2 8.2l5.2 7.6"/></svg>`;
  sound.addEventListener('click',()=>toggleCaveAudio(sound));
  document.body.appendChild(sound); persistentSoundButton=sound; return sound;
}
function toggleCaveAudio(button=ensurePersistentSoundControl()){
  playUiSound('toggle');
  if(caveAudio || audioDesiredOn){
    audioDesiredOn=false;
    if(caveAudio){
    caveAudio.stopped=true;
    for(const node of caveAudio.sources){try{node.stop()}catch(e){}}
    try{caveAudio.ctx.close()}catch(e){}
    caveAudio=null;
    }
    if(uiAudioCtx){ try{uiAudioCtx.close()}catch(e){} uiAudioCtx=null; }
    button.setAttribute('aria-pressed','false'); button.setAttribute('aria-label','Turn sound on'); button.title='Sound off: click to enable'; return;
  }

function startCaveAudio(button=ensurePersistentSoundControl()){
  if(caveAudio || !audioDesiredOn) return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext; if(!AudioCtx) return;
  const ctx=new AudioCtx();
  const master=ctx.createGain(); master.gain.value=.88; master.connect(ctx.destination);

  // Broad, non-tonal cave air: two filtered noise beds with very slow movement.
  const lowAir=ctx.createBufferSource(); lowAir.buffer=createNoiseBuffer(ctx,7,'brown'); lowAir.loop=true;
  const lowFilter=ctx.createBiquadFilter(); lowFilter.type='lowpass'; lowFilter.frequency.value=150; lowFilter.Q.value=.45;
  const lowGain=ctx.createGain(); lowGain.gain.value=.075;
  lowAir.connect(lowFilter).connect(lowGain).connect(master);

  const highAir=ctx.createBufferSource(); highAir.buffer=createNoiseBuffer(ctx,9,'air'); highAir.loop=true;
  const highFilter=ctx.createBiquadFilter(); highFilter.type='bandpass'; highFilter.frequency.value=430; highFilter.Q.value=.38;
  const highGain=ctx.createGain(); highGain.gain.value=.031;
  highAir.connect(highFilter).connect(highGain).connect(master);

  const slow=ctx.createOscillator(), slowDepth=ctx.createGain(); slow.type='sine'; slow.frequency.value=.018; slowDepth.gain.value=.020;
  slow.connect(slowDepth).connect(lowGain.gain);
  const drift=ctx.createOscillator(), driftDepth=ctx.createGain(); drift.type='sine'; drift.frequency.value=.011; driftDepth.gain.value=85;
  drift.connect(driftDepth).connect(highFilter.frequency);

  lowAir.start(); highAir.start(); slow.start(); drift.start();
  caveAudio={ctx,master,sources:[lowAir,highAir,slow,drift],stopped:false};

function playFootsteps(){
  if(!audioDesiredOn) return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext; if(!AudioCtx) return;
  if(!uiAudioCtx) uiAudioCtx=new AudioCtx();
  const ctx=uiAudioCtx; if(ctx.state==='suspended') ctx.resume();
  const makeStep=(when, strength, panValue)=>{
    const src=ctx.createBufferSource(); src.buffer=createNoiseBuffer(ctx,.28,'air');
    const low=ctx.createBiquadFilter(); low.type='lowpass'; low.frequency.value=260; low.Q.value=.7;
    const body=ctx.createBiquadFilter(); body.type='peaking'; body.frequency.value=105; body.Q.value=.8; body.gain.value=7;
    const gain=ctx.createGain();
    const pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    gain.gain.setValueAtTime(.0001,when);
    gain.gain.exponentialRampToValueAtTime(.18*strength,when+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,when+.24);
    if(pan){pan.pan.value=panValue;src.connect(low).connect(body).connect(gain).connect(pan).connect(ctx.destination)}else{src.connect(low).connect(body).connect(gain).connect(ctx.destination)}
    src.start(when);src.stop(when+.27);
    const crunch=ctx.createBufferSource(); crunch.buffer=createNoiseBuffer(ctx,.16,'air');
    const crunchFilter=ctx.createBiquadFilter(); crunchFilter.type='bandpass'; crunchFilter.frequency.value=1250; crunchFilter.Q.value=.55;
    const crunchGain=ctx.createGain(); crunchGain.gain.setValueAtTime(.0001,when+.018);crunchGain.gain.exponentialRampToValueAtTime(.055*strength,when+.03);crunchGain.gain.exponentialRampToValueAtTime(.0001,when+.13);
    crunch.connect(crunchFilter).connect(crunchGain).connect(ctx.destination);crunch.start(when+.015);crunch.stop(when+.16);
  };
  const t=ctx.currentTime+.015; makeStep(t,1,-.16); makeStep(t+.27,.86,.14);
}
let uiAudioCtx=null;
function playUiSound(kind='choice'){
  if(!audioDesiredOn) return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;
  if(!uiAudioCtx) uiAudioCtx=new AudioCtx();
  if(uiAudioCtx.state==='suspended') uiAudioCtx.resume();
  const now=uiAudioCtx.currentTime;
  const osc=uiAudioCtx.createOscillator();
  const gain=uiAudioCtx.createGain();
  const filter=uiAudioCtx.createBiquadFilter();
  const isUtility=kind==='journal'||kind==='back';
  osc.type=isUtility?'sine':kind==='primary'?'triangle':'sine';
  const starts={primary:190,toggle:150,choice:235,journal:610,back:520};
  const ends={primary:92,toggle:110,choice:155,journal:390,back:330};
  osc.frequency.setValueAtTime(starts[kind]||235,now);
  osc.frequency.exponentialRampToValueAtTime(ends[kind]||155,now+(isUtility?.085:.12));
  filter.type=isUtility?'bandpass':'lowpass';
  filter.frequency.value=isUtility?720:900;
  filter.Q.value=isUtility?1.8:.7;
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(isUtility?.024:kind==='primary'?.055:.035,now+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,now+(isUtility?.11:.16));
  osc.connect(filter).connect(gain).connect(uiAudioCtx.destination);
  osc.start(now);osc.stop(now+(isUtility?.13:.18));
}


function playFeedbackSound(kind='save'){
  if(!audioDesiredOn) return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;
  if(!uiAudioCtx) uiAudioCtx=new AudioCtx();
  const ctx=uiAudioCtx;if(ctx.state==='suspended')ctx.resume();
  const now=ctx.currentTime;
  const notes=kind==='note'?[740,980]:[330,440,660];
  notes.forEach((freq,index)=>{
    const osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();
    osc.type=kind==='note'?'sine':'triangle';osc.frequency.value=freq;
    filter.type='lowpass';filter.frequency.value=1600;
    const t=now+index*.045;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(kind==='note'?.028:.024,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+.16);
    osc.connect(filter).connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+.18);
  });
}

        <p>This project is an independent educational work and is not affiliated with, endorsed by, or sponsored by Mammoth Cave National Park or the National Park Service.</p>
        <p>Historical notes included throughout the experience are based on publicly available research and are presented in simplified form for educational accessibility.</p>
        <p>AI tools were used as partial assistants during design and development. All final creative, technical, educational, and editorial decisions were made by the project team.</p>
        <p>All trademarks, names, and historical references remain the property of their respective owners.</p>
      </div>
    </section>

    <footer class="credits-footer">
      <p>Thank you for playing.</p>
      <button class="credits-return" type="button" aria-label="Return to title screen">Return to Title</button>
    </footer>`;

  wrap.appendChild(shell);

  const toggle = shell.querySelector('.disclaimer-toggle');
  const body = shell.querySelector('.disclaimer-body');
  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    body.hidden = open;
    shell.classList.toggle('disclaimer-open', !open);
    playUiSound('journal');
  });

  shell.querySelector('.credits-return').addEventListener('click', () => {
    if (beginTransition()) resetGame('title');
  });
}

function safeTxt(value) {
  return String(value ?? '').replace(/\r?\n/g, ' ').trim();
}

function buildPlaytestReport() {
  const ending = computeEnding();
  const endedAt = new Date();
  const totalSeconds = Math.max(0, Math.round(sessionElapsedSeconds()));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  const preserved = state.choices.filter(c => c.preserved).length;
  const withheld = state.choices.filter(c => !c.preserved).length;
  const uniqueScreens = [...new Set(playtest.visits.map(v => v.nodeId))];

  const lines = [
    'BENEATH THE STONE — PLAYTEST SESSION REPORT',
    '======================================',
    '',
    `Session ID: ${playtest.sessionId}`,
    `Started: ${playtest.startedAt.toISOString()}`,
    `Exported: ${endedAt.toISOString()}`,
    `Total play time: ${minutes}m ${seconds}s`,
    `Ending: ${ending.title}`,
    '',
    'SESSION SUMMARY',
    '---------------',
    `Decisions completed: ${state.choices.length}`,
    `Entered the record: ${preserved}`,
    `Held in restraint: ${withheld}`,
    `Historical contexts discovered: ${state.notes.length} / 7`,
    `Journal opened: ${playtest.journalOpenCount} time(s)`,
    `Back used: ${playtest.backCount} time(s)`,
    `Unique screens visited: ${uniqueScreens.length}`,
    '',
    'DECISION PATH',
    '-------------'
  ];

  state.choices.forEach((choice, index) => {
    lines.push(`${index + 1}. [${choice.era}] ${choice.id}`);
    lines.push(`   Dimension: ${choice.dimension}`);
    lines.push(`   Decision: ${safeTxt(choice.text)}`);
    lines.push(`   Classification: ${choice.preserved ? 'Entered the record' : 'Held in restraint'}`);
    lines.push(`   Time before choosing: ${choice.decisionSeconds ?? 'N/A'} seconds`);
    lines.push(`   Consequence: ${safeTxt(choice.consequence)}`);
    lines.push('');
  });

  lines.push('HISTORICAL CONTEXTS DISCOVERED', '------------------------------');
  if (!state.notes.length) lines.push('None');
  state.notes.forEach((note, index) => lines.push(`${index + 1}. ${safeTxt(note.term)}`));

  lines.push('', 'ROUTE', '-----');
  lines.push(playtest.visits.map(v => v.nodeId).join(' → '));

  lines.push('', 'EVENT LOG', '---------');
  playtest.events.forEach((event, index) => {
    const details = Object.entries(event)
      .filter(([key]) => !['seconds', 'type'].includes(key))
      .map(([key, value]) => `${key}=${safeTxt(value)}`)
      .join(' | ');
    lines.push(`${index + 1}. +${event.seconds}s | ${event.type}${details ? ' | ' + details : ''}`);
  });

  lines.push('', 'PRIVACY NOTE', '------------');
  lines.push('This file was generated locally in the browser. It contains no name, email address, IP address, or form-submitted personal information.');
  return lines.join('\n');
}

function showExportStatus(message) {
  let status = document.getElementById('exportStatus');
  if (!status) {
    status = document.createElement('div');
    status.id = 'exportStatus';
    status.className = 'export-status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    document.querySelector('.reflection-shell .choices')?.appendChild(status);
  }
  status.textContent = message;
}

function exportPlaytestReport() {
  const report = '\ufeff' + buildPlaytestReport();
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  const filename = `what-remains-playtest-${stamp}.txt`;
  let completed = false;

  try {
    const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
    if (navigator.msSaveOrOpenBlob) {
      navigator.msSaveOrOpenBlob(blob, filename);
      completed = true;
    } else {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      completed = true;
    }
  } catch (error) {
    completed = false;
  }

  if (!completed) {
    try {
      const fallback = document.createElement('a');
      fallback.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(report);
      fallback.download = filename;
      fallback.target = '_blank';
      fallback.rel = 'noopener';
      fallback.style.display = 'none';
      document.body.appendChild(fallback);
      fallback.click();
      fallback.remove();
      completed = true;
    } catch (error) {
      completed = false;
    }
  }

  if (completed) {
    showExportStatus(`Report requested: ${filename}. Check your Downloads folder.`);
    logPlaytestEvent('report_exported', { ending: computeEnding().title, filename });
    playFeedbackSound('save');
  } else {
    showExportStatus('This browser blocked the file download. Open the game in Chrome, Safari, Edge, or Firefox and try again.');
  }
}

function computeEnding() {
  const doc = state.choices.filter(c => c.preserved).length;
  const priv = state.choices.filter(c => !c.preserved).length;
  const chose = (id) => state.choices.some(c => c.id === id && c.preserved);
  const withheld = (id) => state.choices.some(c => c.id === id && !c.preserved);

  let ending;
  if (doc >= priv + 2) {
    ending = {
      title: "The Archivist's Path",
      analysis: "You repeatedly chose to create a record. Your journal preserves more evidence—but each entry also reflects a decision you made on someone else’s behalf."
    };
  } else if (priv >= doc + 2) {
    ending = {
      title: "The Keeper's Path",
      analysis: "You repeatedly chose restraint. Some knowledge may remain unavailable, but its absence reflects a boundary you chose not to cross."
    };
  } else {
    ending = {
      title: "The Steward's Path",
      analysis: "You chose both documentation and restraint. Your record is incomplete because each moment required a different kind of care."
    };
  }

  const notes = [];
  if (chose('story')) notes.push("You argued that authority over the story itself should move.");
  if (withheld('gesture') && withheld('slipper')) notes.push("In the deep past, you chose not to turn private moments into images or notes.");
  if (chose('remains') && chose('guide')) notes.push("In the lantern age, you documented both knowledge and its cost.");
  if (withheld('restore')) notes.push("You chose to keep the damage visible rather than erase it.");
  ending.note = notes.length ? notes[0] : null;
  return ending;
}

function runEndingSequence(wrap) {
  if (prefersReducedMotion()) { renderReflection(wrap); return; }
  const sequence = document.createElement('div');
  sequence.className = 'ending-sequence';
  wrap.appendChild(sequence);

  const showLine = (text) => {
    sequence.innerHTML = '';
    const p = document.createElement('p');
    p.textContent = text;
    sequence.appendChild(p);
  };

  showLine('Reading the pattern of your choices…');
  setTimeout(() => showLine('What did you leave in the record?'), 900);
  setTimeout(() => {
    sequence.remove();
    renderReflection(wrap);
  }, 1750);
}

function shortChoiceText(choice) {
  return choice.text
    .replace(/^You\s+/i, '')
    .replace(/\.$/, '')
    .replace(/^documented/i, 'Documented')
    .replace(/^photographed/i, 'Photographed')
    .replace(/^chose/i, 'Chose')
    .replace(/^left/i, 'Left')
    .replace(/^did not/i, 'Did not')
    .replace(/^asked/i, 'Asked')
    .replace(/^argued/i, 'Argued')
    .replace(/^supported/i, 'Supported')
    .replace(/^kept/i, 'Kept');
}

function buildJourneyCards() {
  const section = document.createElement('section');
  section.className = 'journey-cards';
  section.setAttribute('aria-label', 'Your decisions across the three ages');

  ['Deep Past', 'Lantern Age', 'Present Day'].forEach(eraName => {
    const card = document.createElement('article');
    card.className = 'journey-card';
    const h = document.createElement('h3');
    h.textContent = eraName;
    card.appendChild(h);
    const ul = document.createElement('ul');
    const items = state.choices.filter(c => c.era === eraName || (eraName === 'Present Day' && c.era === 'Present'));
    items.forEach(c => {
      const li = document.createElement('li');
      li.className = c.preserved ? 'recorded' : 'withheld';
      li.textContent = shortChoiceText(c);
      ul.appendChild(li);
    });
    card.appendChild(ul);
    section.appendChild(card);
  });
  return section;
}

function buildDecisionReview(preserved, released) {
  const details = document.createElement('details');
  details.className = 'decision-review';
  const summary = document.createElement('summary');
  summary.textContent = 'Review the consequences of my decisions';
  details.appendChild(summary);

  const content = document.createElement('div');
  content.className = 'decision-review-content';

  const addGroup = (title, items) => {
    if (!items.length) return;
    const group = document.createElement('section');
    group.className = 'decision-group';
    const h = document.createElement('h3');
    h.textContent = title;
    group.appendChild(h);
    const ul = document.createElement('ul');
    items.forEach(c => {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${c.text}</strong><br>${c.consequence}`;
      ul.appendChild(li);
    });
    group.appendChild(ul);
    content.appendChild(group);
  };

  addGroup('Entered the record', preserved);
  addGroup('Left unrecorded', released);
  details.appendChild(content);
  return details;
}

function renderReflection(wrap) {
  const ending = computeEnding();
  const preserved = state.choices.filter(c => c.preserved);
  const released = state.choices.filter(c => !c.preserved);

  const shell = document.createElement('div');
  shell.className = 'reflection-shell';

  const path = document.createElement('section');
  path.className = 'path-card';
  path.innerHTML = `<div class="path-kicker">Your Path</div><h2>${ending.title}</h2><p>${ending.analysis}</p>`;
  if (ending.note) {
    const note = document.createElement('div');
    note.className = 'path-note';
    note.textContent = ending.note;
    path.appendChild(note);
  }
  shell.appendChild(path);
  shell.appendChild(buildJourneyCards());

  const summary = document.createElement('section');
  summary.className = 'reflection-summary';
  summary.setAttribute('aria-label', 'Summary of what entered the record');
  summary.innerHTML = `
    <article class="summary-card"><strong>${preserved.length}</strong><span>Entered the record</span><p>What you documented may now travel beyond the cave.</p></article>
    <article class="summary-card"><strong>${released.length}</strong><span>Left unrecorded</span><p>What you withheld remains absent from the archive.</p></article>`;
  shell.appendChild(summary);
  shell.appendChild(buildDecisionReview(preserved, released));

  const finale = document.createElement('section');
  finale.className = 'reflection-finale';
  finale.innerHTML = `
    <p class="witness-line">The cave did not ask you to recover everything.<br>It asked what kind of witness you would become.</p>
    <p class="archive-line">Every archive is shaped by choice.</p>
    <p class="final-question">Who should decide what is remembered?</p>`;
  shell.appendChild(finale);

  const choicesDiv = document.createElement('div');
  choicesDiv.className = 'choices';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'continue-btn';
  btn.textContent = 'Walk the ages differently';
  btn.setAttribute('aria-label', 'Restart the game and walk the ages differently');
  btn.addEventListener('click', () => { if (beginTransition()) resetGame('start'); });
  choicesDiv.appendChild(btn);

  const exportBtn = document.createElement('button');
  exportBtn.type = 'button';
  exportBtn.className = 'continue-btn playtest-export-btn';
  exportBtn.innerHTML = '<span aria-hidden="true">⇩</span> Export Playtest Data (.txt)';
  exportBtn.setAttribute('aria-label', 'Export this playtest session as a text file');
  exportBtn.addEventListener('click', exportPlaytestReport);
  choicesDiv.appendChild(exportBtn);

  const exportNote = document.createElement('p');
  exportNote.className = 'playtest-export-note';
  exportNote.textContent = "Privacy Notice: Gameplay data stays in this browser tab unless you choose to save. Saving keeps your current passage, choices, notes, and playtest log in this browser after it closes. Clearing browser data removes the save. Nothing is transmitted or collected automatically. You may choose to export a text report of your own session for research or playtesting purposes.";
  choicesDiv.appendChild(exportNote);

  const aboutBtn = document.createElement('button');
  aboutBtn.type = 'button';
  aboutBtn.className = 'continue-btn';
  aboutBtn.textContent = 'About the Experience';
  aboutBtn.setAttribute('aria-label', 'View information about the experience');
  aboutBtn.addEventListener('click', () => navigateTo('about', { animateBrand: true }));
  choicesDiv.appendChild(aboutBtn);

  const creditsBtn = document.createElement('button');
  creditsBtn.type = 'button';
  creditsBtn.className = 'continue-btn';
  creditsBtn.textContent = 'Credits & Disclaimer';
  creditsBtn.setAttribute('aria-label', 'View credits and disclaimer');
  creditsBtn.addEventListener('click', () => navigateTo('credits', { animateBrand: true }));
  choicesDiv.appendChild(creditsBtn);
  shell.appendChild(choicesDiv);

  const note = document.createElement('div');
  note.className = 'footer-note';
  note.innerHTML = 'Your choices led to one of three paths. Different choices may lead to a different ending.<br>The individual characters and scenes in this story are imagined composites.';
  shell.appendChild(note);

  wrap.appendChild(shell);
  focusPassageHeading(wrap, '.path-card h2');
}

armInitialAudioExperience();
render('title');


// ---------- v40: gameplay pointer light and local hover response ----------
(function initGameplayPointerEffects(){
  const flashlight=document.getElementById('gameFlashlight');
  if(!flashlight || window.matchMedia('(hover: none), (pointer: coarse)').matches) return;

  let raf=0;
  let targetX=window.innerWidth/2;
  let targetY=window.innerHeight*.45;
  let currentX=targetX;
  let currentY=targetY;

  function animateLight(){
    currentX+=(targetX-currentX)*.16;
    currentY+=(targetY-currentY)*.16;
    document.documentElement.style.setProperty('--game-light-x',currentX+'px');
    document.documentElement.style.setProperty('--game-light-y',currentY+'px');
    if(Math.abs(targetX-currentX)>.2 || Math.abs(targetY-currentY)>.2){
      raf=requestAnimationFrame(animateLight);
    } else raf=0;
  }

  document.addEventListener('pointermove',(e)=>{
    if(prefersReducedMotion() || document.body.getAttribute('data-screen') !== 'gameplay') return;
    targetX=e.clientX;
    targetY=e.clientY;
    if(!raf) raf=requestAnimationFrame(animateLight);

    const passage=e.target.closest('#content > .passage');
    if(passage){
      const r=passage.getBoundingClientRect();
      passage.style.setProperty('--local-x',((e.clientX-r.left)/r.width*100)+'%');
      passage.style.setProperty('--local-y',((e.clientY-r.top)/r.height*100)+'%');
    }

  },{passive:true});
})();


// v42: one pointer-light behavior for every gameplay choice.
document.addEventListener('pointermove', (event) => {
  if (prefersReducedMotion() || document.body.getAttribute('data-screen') !== 'gameplay') return;
  const choice = event.target.closest('button.game-choice, .discovery-gate button');
  if (!choice) return;
  const rect = choice.getBoundingClientRect();
  choice.style.setProperty('--choice-x', `${event.clientX - rect.left}px`);
  choice.style.setProperty('--choice-y', `${event.clientY - rect.top}px`);
}, { passive: true });

</script>
